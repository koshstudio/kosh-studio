<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kosh Studio | Multi-Vendor Marketplace Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #212121;
      --muted: #878787;
      --primary: #111111;
      --accent: #d4af37;
      --border: #e0e0e0;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --success: #388e3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }

    .top-strip {
      background: var(--primary);
      color: var(--accent);
      text-align: center;
      padding: 6px 12px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    header {
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 60;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .brand-name {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--primary);
      cursor: pointer;
    }

    .header-search {
      flex-grow: 1;
      max-width: 500px;
      display: flex;
      background: #f1f3f6;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .header-search input {
      width: 100%;
      border: none;
      background: transparent;
      padding: 8px 12px;
      font-size: 0.85rem;
      outline: none;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text);
      font-weight: 600;
    }

    .cart-badge {
      position: absolute;
      top: -4px;
      right: 2px;
      background: var(--accent);
      color: #000;
      font-size: 0.6rem;
      font-weight: 700;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container { max-width: 1200px; margin: 16px auto; padding: 0 10px; }
    .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

    @media (min-width: 768px) {
      .products-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .product-img { width: 100%; padding-top: 100%; position: relative; background: #f9f9f9; }
    .product-img img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

    .product-info { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; }
    .p-title { font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; }
    .p-price { font-size: 1rem; font-weight: 700; color: #111; margin-bottom: 8px; }

    .btn-add-cart {
      width: 100%; background: var(--primary); color: #fff; border: none; padding: 8px;
      border-radius: 4px; font-size: 0.78rem; font-weight: 700; cursor: pointer; text-transform: uppercase;
    }

    .app-page { display: none; }
    .app-page.active { display: block; }
    .page-header { background: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--border); }
    .back-btn { background: none; border: none; font-size: 1rem; cursor: pointer; font-weight: 700; }
    .page-content { max-width: 500px; margin: 20px auto; padding: 0 16px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.9rem; outline: none; }

    .btn-solid {
      width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px;
      border-radius: 4px; font-size: 0.9rem; font-weight: 700; cursor: pointer; text-transform: uppercase;
    }
    .auth-link { color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="top-strip">⚡ KOSH STUDIO MARKETPLACE PRO</div>

  <!-- HOME PAGE -->
  <div id="page-home" class="app-page active">
    <header>
      <a class="brand-name" onclick="navigateTo('home')">Kosh Studio</a>
      <div class="header-search">
        <input type="text" placeholder="Search products..." id="searchInput" oninput="filterProducts(this.value)">
      </div>
      <div class="header-icons">
        <button class="icon-btn" onclick="navigateTo('profile')">
          <span>Account</span>
        </button>
      </div>
    </header>

    <main class="container">
      <div class="products-grid" id="productGrid">
        <!-- Sample Product -->
        <div class="product-card">
          <div class="product-img"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" alt="Watch"></div>
          <div class="product-info">
            <div class="p-title">Luxury Classic Watch</div>
            <div class="p-price">₹1,499</div>
            <button class="btn-add-cart" onclick="alert('Added to cart!')">Add to Cart</button>
          </div>
        </div>
        <div class="product-card">
          <div class="product-img"><img src="https://images.unsplash.com/photo-1627123424574-724758594e93" alt="Wallet"></div>
            <div class="product-info">
            <div class="p-title">Leather Executive Wallet</div>
            <div class="p-price">₹799</div>
            <button class="btn-add-cart" onclick="alert('Added to cart!')">Add to Cart</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- PROFILE & AUTHENTICATION PAGE -->
  <div id="page-profile" class="app-page">
    <div class="page-header">
      <button class="back-btn" onclick="navigateTo('home')">← Back</button>
      <span style="font-weight:700;">Customer Account</span>
    </div>
    <div class="page-content">
      <div id="authLoginView" style="background:#fff; padding:25px; border-radius:6px; border:1px solid var(--border);">
        <h3 style="margin-bottom:16px; text-align:center;">Login</h3>
        <div class="form-group"><label>Email Address</label><input type="email" id="loginEmail" placeholder="name@gmail.com"></div>
        <div class="form-group"><label>Password</label><input type="password" id="loginPass" placeholder="******"></div>
        <button class="btn-solid" onclick="handleLogin()">Login</button>
        <p style="font-size:0.82rem; text-align:center; margin-top:14px;">New user? <span class="auth-link" onclick="switchAuthView('signup')">Sign Up</span></p>
      </div>

      <div id="authSignupView" style="background:#fff; padding:25px; border-radius:6px; border:1px solid var(--border); display:none;">
        <h3 style="margin-bottom:16px; text-align:center;">Sign Up</h3>
        <div class="form-group"><label>Email Address</label><input type="email" id="signupEmail" placeholder="name@gmail.com"></div>
        <div class="form-group"><label>Password</label><input type="password" id="signupPass" placeholder="6+ characters"></div>
        <button class="btn-solid" onclick="handleSignup()">Register</button>
        <p style="font-size:0.82rem; text-align:center; margin-top:14px;">Already have account? <span class="auth-link" onclick="switchAuthView('login')">Login</span></p>
      </div>

      <div id="userDashboardSection" style="background:#fff; padding:25px; border-radius:6px; border:1px solid var(--border); display:none; text-align:center;">
        <h3>👤 Welcome!</h3>
        <p id="displayUserEmail" style="color:var(--muted); margin:10px 0;"></p>
        <button class="btn-solid" style="background:#ff5252;" onclick="handleLogout()">Logout</button>
      </div>
    </div>
  </div>

  <script>
    function navigateTo(pageId) {
      document.querySelectorAll('.app-page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + pageId).classList.add('active');
      window.scrollTo(0, 0);
    }

    function switchAuthView(view) {
      if (view === 'signup') {
        document.getElementById('authLoginView').style.display = 'none';
        document.getElementById('authSignupView').style.display = 'block';
      } else {
        document.getElementById('authSignupView').style.display = 'none';
        document.getElementById('authLoginView').style.display = 'block';
      }
    }

    function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPass').value.trim();

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        alert('Kripya ek valid email address enter karein (Jaise: name@gmail.com)!');
        return;
      }
      if (password.length < 6) {
        alert('Password kam se kam 6 characters ka hona chahiye!');
        return;
      }

      const savedUsers = JSON.parse(localStorage.getItem('kosh_users') || '[]');
      const matchedUser = savedUsers.find(u => u.email === email && u.password === password);
      const isAdmin = (email === 'admin@kosh.com' && password === 'admin123');

      if (matchedUser || isAdmin) {
        alert('Login successful!');
        localStorage.setItem('kosh_logged_in', JSON.stringify(matchedUser || { email }));
        showDashboard(email);
      } else {
        alert('Invalid email or password! Pehle Sign Up karein.');
      }
    }

    function handleSignup() {
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPass').value.trim();

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        alert('Kripya ek valid email enter karein!');
        return;
      }
      if (password.length < 6) {
        alert('Password kam se kam 6 characters ka hona chahiye!');
        return;
      }

      let savedUsers = JSON.parse(localStorage.getItem('kosh_users') || '[]');
      if (savedUsers.some(u => u.email === email)) {
        alert('Yeh email pehle se registered hai! Ab login karein.');
        switchAuthView('login');
        return;
      }

      savedUsers.push({ email, password });
      localStorage.setItem('kosh_users', JSON.stringify(savedUsers));
      alert('Account ban gaya! Ab login karein.');
      switchAuthView('login');
    }

    function handleLogout() {
      localStorage.removeItem('kosh_logged_in');
      document.getElementById('userDashboardSection').style.display = 'none';
      document.getElementById('authLoginView').style.display = 'block';
      alert('Logged out successfully.');
    }

    function showDashboard(email) {
      document.getElementById('authLoginView').style.display = 'none';
      document.getElementById('authSignupView').style.display = 'none';
      document.getElementById('userDashboardSection').style.display = 'block';
      document.getElementById('displayUserEmail').innerText = email;
    }

    window.onload = function() {
      const loggedIn = localStorage.getItem('kosh_logged_in');
      if (loggedIn) {
        try {
          const user = JSON.parse(loggedIn);
          showDashboard(user.email);
        } catch(e) {}
      }
    };
  </script>
</body>
</html>
