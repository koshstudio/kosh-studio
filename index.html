<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosh Studio | Luxury Lifestyle Accessories</title>
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c0c0c;
            color: #fff;
        }
        /* Center Luxury Header */
        .header-center {
            text-align: center;
            padding: 30px 20px 15px 20px;
            background-color: #111;
            border-bottom: 1px solid #222;
        }
        .header-center img {
            height: 75px;
            width: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .header-center h1 {
            margin: 0;
            font-size: 24px;
            color: #d4af37;
            letter-spacing: 1px;
            font-weight: 600;
        }
        /* Navigation Menu */
        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 25px;
            background-color: #161616;
            padding: 12px;
            border-bottom: 1px solid #222;
        }
        .nav-menu a {
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-menu a:hover {
            color: #d4af37;
        }
        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
        }
        .store-banner {
            text-align: center;
            padding: 40px 20px;
            background: #141414;
            border-radius: 10px;
            border: 1px solid #222;
            margin-bottom: 25px;
        }
        .store-banner h2 {
            color: #d4af37;
            margin-top: 0;
            font-size: 22px;
        }
        .store-banner p {
            color: #888;
            font-size: 14px;
            margin-bottom: 0;
        }
        footer {
            text-align: center;
            padding: 25px 15px;
            background-color: #111;
            color: #aaa;
            border-top: 1px solid #222;
            margin-top: 50px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Center Luxury Header -->
    <div class="header-center">
        <img src="logo.png" alt="Kosh Studio Logo">
        <h1>Kosh Studio</h1>
    </div>

    <!-- Navigation Menu -->
    <div class="nav-menu">
        <a href="index.html">Home</a>
        <a href="#products">Collection</a>
        <a href="#cart">Cart</a>
    </div>

    <!-- Main Content Area -->
    <div class="container">
        <div class="store-banner">
            <h2>Luxury Lifestyle Accessories</h2>
            <p>Aapke products yahan display honge...</p>
        </div>
    </div>

    <!-- Footer with Copyright -->
    <footer>
        <p style="margin: 0 0 5px 0; font-weight: 500; color: #fff;">&copy; 2026 Kosh Studio. All rights reserved.</p>
        <p style="font-size: 11px; color: #777; margin: 0;">Protected under copyright laws. Unauthorized use or copying is strictly prohibited.</p>
    </footer>

    <!-- EmailJS Integration Script -->
    <script type="text/javascript">
        (function() {
            emailjs.init("YOUR_PUBLIC_KEY"); // Yahan apni EmailJS Public Key dalein
        })();

        function sendOrderEmail(customerData) {
            var templateParams = {
                from_name: customerData.name,
                phone: customerData.phone,
                address: customerData.address,
                message: customerData.cartItems
            };

            emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
                .then(function(response) {
                    alert("Order successfully placed & email sent!");
                }, function(error) {
                    alert("Failed to send email, but order is saved.");
                });
        }
    </script>
</body>
</html>
